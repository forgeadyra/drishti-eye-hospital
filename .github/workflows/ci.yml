name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build gates, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # runs the .mts function tests natively (type stripping)
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # build = images → tsc → client + SSR build → prerender → verify-dist gates
      # (sourcemaps, console.log, exposed files, secrets, CSP-safe HTML, JS budget, h1/alt)
      - run: npm run build
      - name: Contact function security tests
        run: npm run test:contact
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Unused dependencies
        run: npm run check:deps

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose .
